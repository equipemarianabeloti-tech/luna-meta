services:
  - type: web
    name: luna-meta
    runtime: python
    plan: free
    branch: main

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: VERIFY_TOKEN
        sync: false

      - key: META_ACCESS_TOKEN
        sync: false

      - key: META_PHONE_NUMBER_ID
        sync: false

      - key: META_APP_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: GRAPH_API_VERSION
        value: v25.0
